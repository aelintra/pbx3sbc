# PBX3 SBC — split OpenSIPS out of shared syslog
# Spec: FLEET_LOG_RETENTION_REQUIREMENTS.md
# Install: copy to /etc/rsyslog.d/ then systemctl restart rsyslog
# Also installed by install.sh (configure_opensips_logging) and scripts/install-log-retention.sh
#
# OpenSIPS (Debian package) logs via syslog by default. Without this rule,
# xlog lines land in /var/log/syslog with every other daemon. Capture them
# in /var/log/opensips/opensips.log and stop further processing so they do
# not also appear in the shared syslog.

if $programname == "opensips" then {
	action(
		type="omfile"
		file="/var/log/opensips/opensips.log"
		fileCreateMode="0640"
		fileOwner="syslog"
		fileGroup="adm"
	)
	stop
}
