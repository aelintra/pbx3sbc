# Fleet edge provision proxy — HTTPS on provision.{apex}:41363
# Spec: PROVISIONING_IMPLEMENTATION_PLAN.md C2/C5 · PROVISIONING_SERVER_REQUIREMENTS.md §0.3 / #11 / §8
#
# Install: scripts/install-provision-edge.sh
# Map sync: scripts/sync-provision-mac-map.sh
#
# Placeholders replaced by install script:
#   __PROVISION_SERVER_NAME__  e.g. provision.pbx3.com
#   __SSL_CERTIFICATE__        fullchain.pem path (ECDSA OK)
#   __SSL_CERTIFICATE_KEY__    privkey.pem path
#   __SSL_RSA_CERTIFICATE_BLOCK__  optional second ssl_certificate/key (RSA) for legacy phones
#   __MTLS_BLOCK__             replaced by install with ssl_client_certificate lines (or empty)
#
# http{} must include (before this server is used):
#   include /etc/nginx/pbx3-provision/mac-from-request.map;
#   include /etc/nginx/pbx3-provision/provision-mac.map;

server {
    listen 41363 ssl;
    listen [::]:41363 ssl;
    server_name __PROVISION_SERVER_NAME__;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
__SSL_RSA_CERTIFICATE_BLOCK__
    # Session + protocols (inline — cannot redeclare ssl_ciphers after options-ssl include)
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Mozilla intermediate + RSA-CBC for Poly/legacy desks that lack ECDSA suites
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-SHA:AES256-SHA";
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

__MTLS_BLOCK__
    client_max_body_size 1M;

    # Variable proxy_pass requires a resolver (map upstream may be hostname)
    resolver 172.31.0.2 8.8.8.8 ipv6=off valid=30s;
    resolver_timeout 5s;

    access_log /var/log/nginx/pbx3-provision-edge.access.log provision_mtls;
    error_log  /var/log/nginx/pbx3-provision-edge.error.log warn;

    # Health / ops (no MAC) — closed
    location = /health {
        return 404;
    }

    # Exact /provisioning — Snom (and others) use ?mac= here. Bare path (no MAC) → 404 (#11).
    location = /provisioning {
        if ($provision_upstream = "") {
            return 404;
        }

        access_log /var/log/nginx/pbx3-provision-edge.access.log provision_mtls;

        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Provision-Mac $provision_mac;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Variable proxy_pass: pass original URI (?mac=) to home :41363
        proxy_pass $provision_upstream;
    }

    location /provisioning/ {
        # #11 — no routable MAC or unknown MAC → 404 (never 3xx to home)
        if ($provision_upstream = "") {
            return 404;
        }

        # Log MAC → upstream for edge audit (bodies stay on home)
        access_log /var/log/nginx/pbx3-provision-edge.access.log provision_mtls;

        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Provision-Mac $provision_mac;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Variable proxy_pass: pass original URI to home :41363
        proxy_pass $provision_upstream;
    }

    # Bare /{mac}.cfg (some vendor RPS shapes) — quote regex so {12} is not a block
    location ~* "^/[0-9A-Fa-f]{12}\.cfg$" {
        if ($provision_upstream = "") {
            return 404;
        }
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Provision-Mac $provision_mac;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_pass $provision_upstream;
    }

    location / {
        return 404;
    }
}
